template:
  - sensor:
      - name: "Deye Operating Status Text"
        unique_id: iriv_deye_operating_status_text
        state: >
          {% set v = states('sensor.deye_operating_status') | int(-1) %}
          {% set map = {
            0: 'Standby',
            1: 'Self-Test',
            2: 'Normal',
            3: 'Alarm',
            4: 'Fault'
          } %}
          {{ map.get(v, 'Unknown') }}
        icon: >
          {% set v = states('sensor.deye_operating_status') | int(-1) %}
          {% if v == 2 %}mdi:solar-power
          {% elif v == 3 %}mdi:alert
          {% elif v == 4 %}mdi:alert-octagon
          {% else %}mdi:help-circle{% endif %}

      - name: "Deye PV Total Power"
        unique_id: iriv_deye_pv_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set a = states('sensor.deye_pv1_power') | float(0) %}
          {% set b = states('sensor.deye_pv2_power') | float(0) %}
          {{ (a + b) | round(0) }}

# ESPHome Modbus RTU master template for Deye SG05/SG06 hybrid inverters.
# Bench target: emulator/deye-sg06-ivt-emu.py (USB-RS485 slave id 1, 9600 8N1).
# Field: inverter datalogger/meter RS485 port — not the BMS CAN RJ45.
# See README.md for IRIV jobs, poll timing, and JK BMS notes.
# ESPHome `name` sets hostname / mDNS (e.g. sg06-nodemcu.local) and must match
# the device name Home Assistant expects, or the node appears offline.
esphome:
  name: sg06-nodemcu
  friendly_name: SG06 NodeMCU

esp8266:
  board: nodemcuv2

# Disable UART logging so software serial can own the RS485 UART pins.
logger:
  baud_rate: 0

# Home Assistant API
api:
  encryption:
    key: "xNbP/cH9actbGU/mo0IvL42zxtPEa+6bwPCzV8QF7cQ="

ota:
  - platform: esphome
    password: "64e522ab71282531f4eefdd085194bf0"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: SG06-NodeMCU-Fallback
    password: alsvn123
captive_portal:

# ================= UART (Modbus RTU master) =================
# NodeMCU: D5 = GPIO14 -> RS485 module RO/RX
#           D6 = GPIO12 -> RS485 module DI/TX
# Uses software serial on ESP8266; prefer ESP32 + HW UART for denser polling.
uart:
  id: uart_modbus
  rx_pin: GPIO14
  tx_pin: GPIO12
  baud_rate: 9600
  stop_bits: 1

# ================= MODBUS =================
# Deye holding registers are sparse => many separate FC03 ranges.
# Keep update_interval > (ranges x command_throttle + bus time), otherwise
# ESPHome logs "Frame already active" / "Poll refused by hub".
# Bench target: emulator/deye-sg06-ivt-emu.py (slave id 1, 9600 8N1).
modbus:
  id: modbus1
  uart_id: uart_modbus
  send_wait_time: 50ms

modbus_controller:
  - id: deye
    modbus_id: modbus1
    address: 1
    update_interval: 15s
    command_throttle: 100ms
    allow_duplicate_commands: false

# ================= TEXT SENSORS =================    
text_sensor:
  - platform: template
    name: "Inverter Operating Status Text"
    lambda: |-
      int v = (int) id(deye_operating_status).state;
      switch(v) {
        case 0: return {"🔵 Standby"};
        case 1: return {"🟠 Self-Test"};
        case 2: return {"🟢 Normal"};
        case 3: return {"⚠️ Alarm"};
        case 4: return {"🔴 Fault"};
        default: return {"Unknown"};
      }
    update_interval: 15s

# ================= SENSORS =================
sensor:


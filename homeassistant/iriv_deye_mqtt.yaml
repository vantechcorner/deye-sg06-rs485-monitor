# Home Assistant MQTT sensors for Deye SG05/SG06 via IRIV IOC MQTT Gateway.
#
# Matches iriv-ioc-config.json poll jobs:
#   MQTT baseTopic = iriv/ivt
#   Full topic     = iriv/ivt/{topicSuffix}
#   Payload        = JSON {"value": ...}  →  value_json.value
#
# Install:
#   A) Copy to config/packages/iriv_deye_mqtt.yaml with:
#        homeassistant:
#          packages: !include_dir_named packages
#   B) Or merge mqtt: / template: into configuration.yaml

mqtt:
  sensor:
    - name: "Deye Operating Status"
      unique_id: iriv_deye_operating_status
      state_topic: "iriv/ivt/status"
      value_template: "{{ value_json.value }}"
      entity_category: diagnostic
      device: &deye_iriv_device
        identifiers: ["iriv_ivt_deye_sg06"]
        name: "Deye SG06 (IRIV)"
        manufacturer: "Deye"
        model: "SG06 / SG05 hybrid (via IRIV IOC)"
        suggested_area: "Energy"

    # ----- Battery -----
    - name: "Deye Battery Voltage"
      unique_id: iriv_deye_battery_voltage
      state_topic: "iriv/ivt/battery/voltage"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      value_template: "{{ value_json.value }}"
      suggested_display_precision: 2
      device: *deye_iriv_device

    - name: "Deye Battery SOC"
      unique_id: iriv_deye_battery_soc
      state_topic: "iriv/ivt/battery/soc"
      device_class: battery
      state_class: measurement
      unit_of_measurement: "%"
      value_template: "{{ value_json.value }}"
      device: *deye_iriv_device

    - name: "Deye Battery Power"
      unique_id: iriv_deye_battery_power
      state_topic: "iriv/ivt/battery/power"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      value_template: "{{ value_json.value }}"
      device: *deye_iriv_device

    - name: "Deye Battery Current"
      unique_id: iriv_deye_battery_current
      state_topic: "iriv/ivt/battery/current"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      value_template: "{{ value_json.value }}"
      suggested_display_precision: 2
      device: *deye_iriv_device

    - name: "Deye Battery Temperature"
      unique_id: iriv_deye_battery_temperature
      state_topic: "iriv/ivt/battery/temperature"
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      value_template: "{{ value_json.value }}"
      suggested_display_precision: 1
      device: *deye_iriv_device

    - name: "Deye Battery Charge Today"
      unique_id: iriv_deye_battery_charge_today
      state_topic: "iriv/ivt/battery/charge_today"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      value_template: "{{ value_json.value }}"
      suggested_display_precision: 1
      device: *deye_iriv_device

    - name: "Deye Battery Discharge Today"
      unique_id: iriv_deye_battery_discharge_today
      state_topic: "iriv/ivt/battery/discharge_today"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      value_template: "{{ value_json.value }}"
      suggested_display_precision: 1
      device: *deye_iriv_device

    # ----- PV1 / PV2 -----
    - name: "Deye PV1 Voltage"
      unique_id: iriv_deye_pv1_voltage
      state_topic: "iriv/ivt/pv1/voltage"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      value_template: "{{ value_json.value }}"
      suggested_display_precision: 1
      device: *deye_iriv_device

    - name: "Deye PV1 Current"
      unique_id: iriv_deye_pv1_current
      state_topic: "iriv/ivt/pv1/current"
      device_class: current
      state_class: measurement
